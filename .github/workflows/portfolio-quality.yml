name: Portfolio quality
on:
  push:
    branches: [main, 'feat/editorial-portfolio-redesign']
  pull_request:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run lint && npm run build && npm test
      - name: Install pinned accessibility test engine outside application dependencies
        run: npm install --prefix "$RUNNER_TEMP/portfolio-qa" --no-save --ignore-scripts axe-core@4.10.3
      - name: Browser, keyboard, media, reflow and accessibility checks
        run: AXE_SOURCE="$RUNNER_TEMP/portfolio-qa/node_modules/axe-core/axe.min.js" npm run test:browser
      - name: Preserve actual screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-quality
          path: |
            qa-output/
            dist/build-report.json
            .generated/media.json
          if-no-files-found: warn
